services:
  # 1. El SIEM (Elasticsearch)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  # 1.5 El Panel del SIEM (Kibana)
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.3
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  # 1.8 El Cerebro en Memoria (Redis)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # 2. El SOAR (FastAPI)
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - elasticsearch
      - redis
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/secrets:/app/secrets:ro  

  # 3. El Motor de Detección (Vigilante Dockerizado)
  vigilante:
    build: ./backend
    command: python app/detection_engine.py
    depends_on:
      - elasticsearch
      - backend
    volumes:
      - ./backend/rules:/app/rules
    env_file:
      - ./backend/.env

  # 4. El Dashboard (React + Nginx)
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  es_data: